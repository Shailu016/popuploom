# PopupLoom on Cloudflare Workers + D1
# The Worker, database and binding keep their original names for continuity.
name = "popforge"
account_id = "66d3b261587ce5aeb4849141b6cca30d"
workers_dev = true
main = "worker/index.js"
compatibility_date = "2026-10-01"

# Keep both approved custom domains attached on every GitHub deployment.
[[routes]]
pattern = "popuploom.com"
zone_id = "a8ba7d253a7c97dd33d22504bfd5e7aa"
custom_domain = true

[[routes]]
pattern = "www.popuploom.com"
zone_id = "a8ba7d253a7c97dd33d22504bfd5e7aa"
custom_domain = true

[assets]
# The whole project root is the static site; .assetsignore keeps server files,
# the database, and tooling out of the public bucket.
directory = "./.cf-build/public"
binding = "ASSETS"
not_found_handling = "none"
# Every request hits the Worker first so it can apply CSP, no-store headers,
# the public-file allowlist, host redirects and real 404s exactly like Express.
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "popforge"
# Production D1 database provisioned for this deployment.
database_id = "eefbbb0c-aabb-4b08-b596-f0cf53aadc88"
migrations_dir = "worker/migrations"

[vars]
# Comma-separated extra origins allowed to call the API from a browser.
# Leave empty to allow only same-origin (and public widget endpoints).
APP_ORIGINS = ""

# Advertising is live: AdSense approved popuploom.com ("Ready") on 2026-11-09,
# the Google Privacy & messaging CMP is published and a real ad slot exists.
ADSENSE_ENABLED = "true"
ADSENSE_APPROVED = "true"
ADSENSE_PUBLISHER_ID = "pub-8947829712444522"
# Google Privacy & messaging (Google CMP) is configured and its European
# message is published for popuploom.com in the AdSense account.
ADSENSE_CMP = "google-privacy-messaging"
# Real display unit created in AdSense: "PopupLoom Guide Responsive" (responsive).
ADSENSE_SLOT = "4931611985"

# Password reset email. RESEND_API_KEY is an encrypted secret:
#   wrangler secret put RESEND_API_KEY
# Free plan: 3,000 emails/month, 100/day. Verify popuploom.com in Resend
# (SPF + DKIM). An empty sender keeps reset email disabled with a clear error.
RESET_EMAIL_FROM = "PopupLoom <reset@popuploom.com>"
PUBLIC_ORIGIN = "https://popuploom.com"

# Enable only after apex DNS, HTTPS and application smoke checks pass.
DOMAIN_CUTOVER_ENABLED = "true"

NODE_ENV = "production"

[build]
command = "node scripts/build-cf.cjs"
