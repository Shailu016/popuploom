name: Production monitor

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  monitor:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - name: Check production health, headers, embed integrity and DNS
        run: node scripts/monitor.cjs
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          RESET_EMAIL_FROM: ${{ secrets.RESET_EMAIL_FROM }}
      # Guaranteed alert path: the repository secret list currently has no
      # RESEND_API_KEY, so the script's email step is skipped. A GitHub issue
      # still notifies the owner without any extra secret.
      - name: Open or update a monitoring alert issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create monitor-alert --color B60205 --description "Automated production monitor failure" --force >/dev/null 2>&1 || true
          existing=$(gh issue list --label monitor-alert --state open --limit 1 --json number --jq '.[0].number')
          body="Production monitor failed at $(date -u +%Y-%m-%dT%H:%M:%SZ). Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "Production monitor failure" --body "$body" --label monitor-alert
          fi
      - name: Close the monitoring alert issue after recovery
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing=$(gh issue list --label monitor-alert --state open --limit 1 --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Monitor recovered at $(date -u +%Y-%m-%dT%H:%M:%SZ)."
            gh issue close "$existing"
          fi
