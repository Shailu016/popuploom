name: Test and deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    env:
      # Public publisher ID verified in the owner's existing AdSense account.
      # This publishes ads.txt only; advertising remains disabled.
      ADSENSE_PUBLISHER_ID: pub-8947829712444522
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Scan tracked files for secrets
        run: npm run security:scan
      - name: Check Worker build and API integration
        env:
          SITE_VERIFICATION_METAS: ${{ secrets.SITE_VERIFICATION_METAS }}
        run: npm run test:cf:integration
      - name: Check Cloudflare unit tests
        run: npm run test:cf
      - name: Check application and browser regressions
        env:
          POPFORGE_BROWSER: /usr/bin/google-chrome
        run: |
          test -x "$POPFORGE_BROWSER"
          npm test
      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 66d3b261587ce5aeb4849141b6cca30d
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Add the CLOUDFLARE_API_TOKEN repository secret before deploying."
            exit 1
          fi
          npx wrangler d1 migrations apply popforge --remote
      - name: Deploy production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 66d3b261587ce5aeb4849141b6cca30d
          SITE_VERIFICATION_METAS: ${{ secrets.SITE_VERIFICATION_METAS }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Add the CLOUDFLARE_API_TOKEN repository secret before deploying."
            exit 1
          fi
          npm run deploy:cf
      - name: Verify live health
        run: |
          curl --fail --show-error --retry 5 --retry-delay 5 https://popuploom.com/api/health | node -e "let s=''; process.stdin.on('data',c=>s+=c); process.stdin.on('end',()=>{if(JSON.parse(s).ok!==true)process.exit(1)})"
          curl --fail --show-error --retry 5 --retry-delay 5 https://popforge.shailu3597.workers.dev/popforge.js -o /tmp/popuploom-legacy.js
          curl --fail --show-error --retry 5 --retry-delay 5 https://popuploom.com/popuploom.js -o /tmp/popuploom-current.js
          cmp /tmp/popuploom-legacy.js /tmp/popuploom-current.js
