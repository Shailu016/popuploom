<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-label="Crimson beams">
<title>Crimson beams</title>
<desc>Original PopupLoom abstract artwork authored for this project on 2026-11-18. Diagonal crimson light beams on near-black.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#09070B"/><stop offset="1" stop-color="#1A0709"/></linearGradient>
  <filter id="blur" filterUnits="userSpaceOnUse" x="-400" y="-400" width="2000" height="1550"><feGaussianBlur stdDeviation="90"/></filter>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="18"/></filter>
  <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
  <linearGradient id="pane" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0.14"/><stop offset="1" stop-color="#fff" stop-opacity="0.02"/></linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF6B5E" stop-opacity=".9"/><stop offset=".35" stop-color="#FF6B5E" stop-opacity="0"/></linearGradient>
  <linearGradient id="archfill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF4D3D" stop-opacity=".55"/><stop offset="1" stop-color="#FF4D3D" stop-opacity="0"/></linearGradient>
  <radialGradient id="orbfill" cx="35%" cy="30%" r="80%"><stop offset="0" stop-color="#FF4D3D"/><stop offset=".55" stop-color="#FF4D3D"/><stop offset="1" stop-color="#1A0709"/></radialGradient>
  <radialGradient id="sun" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#FF4D3D" stop-opacity=".95"/><stop offset=".7" stop-color="#FF4D3D" stop-opacity=".35"/><stop offset="1" stop-color="#FF4D3D" stop-opacity="0"/></radialGradient>
  <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1A0709" stop-opacity=".9"/><stop offset="1" stop-color="#1A0709"/></linearGradient>
  <linearGradient id="fadeTop" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#09070B"/><stop offset=".85" stop-color="#09070B" stop-opacity=".0"/></linearGradient>
  <radialGradient id="vig" cx="55%" cy="45%" r="80%"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.45"/></radialGradient>
</defs>
<rect width="1200" height="750" fill="url(#bg)"/>
<g filter="url(#blur)"><ellipse cx="880" cy="300" rx="360" ry="300" fill="#B3221A" opacity="0.6"/><ellipse cx="1080" cy="640" rx="260" ry="200" fill="#FF4D3D" opacity="0.25"/></g>
<path d="M420 -40 L490 -40 L160 790 L90 790 Z" fill="#FF6B5E" opacity="0.050"/><path d="M540 -40 L610 -40 L280 790 L210 790 Z" fill="#FF6B5E" opacity="0.085"/><path d="M660 -40 L730 -40 L400 790 L330 790 Z" fill="#FF6B5E" opacity="0.120"/><path d="M780 -40 L850 -40 L520 790 L450 790 Z" fill="#FF6B5E" opacity="0.050"/><path d="M900 -40 L970 -40 L640 790 L570 790 Z" fill="#FF6B5E" opacity="0.085"/><path d="M1020 -40 L1090 -40 L760 790 L690 790 Z" fill="#FF6B5E" opacity="0.120"/><path d="M1140 -40 L1210 -40 L880 790 L810 790 Z" fill="#FF6B5E" opacity="0.050"/><line x1="680" y1="-20" x2="300" y2="770" stroke="#FF6B5E" stroke-opacity=".5" stroke-width="1.4"/>
<rect width="1200" height="750" fill="url(#vig)"/>
<rect width="1200" height="750" filter="url(#grain)" opacity="0.075" style="mix-blend-mode:overlay"/>
</svg>