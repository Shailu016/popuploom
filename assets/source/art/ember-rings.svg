<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-label="Ember rings">
<title>Ember rings</title>
<desc>Original PopupLoom abstract artwork authored for this project on 2026-11-18. Concentric hairline rings over an ember glow on near-black.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0A0B0F"/><stop offset="1" stop-color="#170C08"/></linearGradient>
  <filter id="blur" filterUnits="userSpaceOnUse" x="-400" y="-400" width="2000" height="1550"><feGaussianBlur stdDeviation="90"/></filter>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="18"/></filter>
  <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
  <linearGradient id="pane" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0.14"/><stop offset="1" stop-color="#fff" stop-opacity="0.02"/></linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFB08A" stop-opacity=".9"/><stop offset=".35" stop-color="#FFB08A" stop-opacity="0"/></linearGradient>
  <linearGradient id="archfill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF6B4A" stop-opacity=".55"/><stop offset="1" stop-color="#FF6B4A" stop-opacity="0"/></linearGradient>
  <radialGradient id="orbfill" cx="35%" cy="30%" r="80%"><stop offset="0" stop-color="#FF6B4A"/><stop offset=".55" stop-color="#FF6B4A"/><stop offset="1" stop-color="#170C08"/></radialGradient>
  <radialGradient id="sun" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#FF6B4A" stop-opacity=".95"/><stop offset=".7" stop-color="#FF6B4A" stop-opacity=".35"/><stop offset="1" stop-color="#FF6B4A" stop-opacity="0"/></radialGradient>
  <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#170C08" stop-opacity=".9"/><stop offset="1" stop-color="#170C08"/></linearGradient>
  <linearGradient id="fadeTop" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0A0B0F"/><stop offset=".85" stop-color="#0A0B0F" stop-opacity=".0"/></linearGradient>
  <radialGradient id="vig" cx="55%" cy="45%" r="80%"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.45"/></radialGradient>
</defs>
<rect width="1200" height="750" fill="url(#bg)"/>
<g filter="url(#blur)"><ellipse cx="860" cy="330" rx="360" ry="300" fill="#FF6B4A" opacity="0.55"/><ellipse cx="1080" cy="120" rx="260" ry="220" fill="#FFA65C" opacity="0.35"/></g>
<circle cx="820" cy="390" r="70" fill="none" stroke="#FFB08A" stroke-opacity="0.340" stroke-width="1.1"/><circle cx="820" cy="390" r="116" fill="none" stroke="#FFB08A" stroke-opacity="0.308" stroke-width="1.1"/><circle cx="820" cy="390" r="162" fill="none" stroke="#FFB08A" stroke-opacity="0.276" stroke-width="2.2"/><circle cx="820" cy="390" r="208" fill="none" stroke="#FFB08A" stroke-opacity="0.244" stroke-width="1.1"/><circle cx="820" cy="390" r="254" fill="none" stroke="#FFB08A" stroke-opacity="0.212" stroke-width="1.1"/><circle cx="820" cy="390" r="300" fill="none" stroke="#FFB08A" stroke-opacity="0.180" stroke-width="1.1"/><circle cx="820" cy="390" r="346" fill="none" stroke="#FFB08A" stroke-opacity="0.148" stroke-width="1.1"/><circle cx="820" cy="390" r="392" fill="none" stroke="#FFB08A" stroke-opacity="0.116" stroke-width="1.1"/><circle cx="820" cy="390" r="438" fill="none" stroke="#FFB08A" stroke-opacity="0.084" stroke-width="1.1"/><circle cx="820" cy="390" r="6" fill="#FFB08A" fill-opacity=".9"/><path d="M820 390 L970 180" stroke="#FFB08A" stroke-opacity=".55" stroke-width="1.6"/>
<rect width="1200" height="750" fill="url(#vig)"/>
<rect width="1200" height="750" filter="url(#grain)" opacity="0.075" style="mix-blend-mode:overlay"/>
</svg>