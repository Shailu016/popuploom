<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-label="Dusk orb">
<title>Dusk orb</title>
<desc>Original PopupLoom abstract artwork authored for this project on 2026-11-18. A lit amber moon on deep aubergine.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0E0A14"/><stop offset="1" stop-color="#1E1030"/></linearGradient>
  <filter id="blur" filterUnits="userSpaceOnUse" x="-400" y="-400" width="2000" height="1550"><feGaussianBlur stdDeviation="90"/></filter>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="18"/></filter>
  <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
  <linearGradient id="pane" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0.14"/><stop offset="1" stop-color="#fff" stop-opacity="0.02"/></linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFC58A" stop-opacity=".9"/><stop offset=".35" stop-color="#FFC58A" stop-opacity="0"/></linearGradient>
  <linearGradient id="archfill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF8A3D" stop-opacity=".55"/><stop offset="1" stop-color="#FF8A3D" stop-opacity="0"/></linearGradient>
  <radialGradient id="orbfill" cx="35%" cy="30%" r="80%"><stop offset="0" stop-color="#FFE0B8"/><stop offset=".55" stop-color="#F2852E"/><stop offset="1" stop-color="#2A1208"/></radialGradient>
  <radialGradient id="sun" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#FF8A3D" stop-opacity=".95"/><stop offset=".7" stop-color="#FF8A3D" stop-opacity=".35"/><stop offset="1" stop-color="#FF8A3D" stop-opacity="0"/></radialGradient>
  <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1E1030" stop-opacity=".9"/><stop offset="1" stop-color="#1E1030"/></linearGradient>
  <linearGradient id="fadeTop" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0E0A14"/><stop offset=".85" stop-color="#0E0A14" stop-opacity=".0"/></linearGradient>
  <radialGradient id="vig" cx="55%" cy="45%" r="80%"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.45"/></radialGradient>
</defs>
<rect width="1200" height="750" fill="url(#bg)"/>
<g filter="url(#blur)"><ellipse cx="800" cy="380" rx="380" ry="300" fill="#7A3A12" opacity="0.5"/><ellipse cx="1060" cy="120" rx="220" ry="180" fill="#8B4FD6" opacity="0.22"/></g>

    <ellipse cx="800" cy="630" rx="230" ry="26" fill="#000" opacity="0.35" filter="url(#soft)"/>
    <circle cx="800" cy="380" r="200" fill="url(#orbfill)"/>
    <circle cx="800" cy="380" r="200" fill="none" stroke="#FFC58A" stroke-opacity=".3" stroke-width="1.2"/>
    <ellipse cx="730" cy="290" rx="70" ry="44" fill="#fff" opacity=".22" filter="url(#soft)"/>
<rect width="1200" height="750" fill="url(#vig)"/>
<rect width="1200" height="750" filter="url(#grain)" opacity="0.075" style="mix-blend-mode:overlay"/>
</svg>