<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-label="Gold orb">
<title>Gold orb</title>
<desc>Original PopupLoom abstract artwork authored for this project on 2026-11-18. A lit gold sphere on midnight navy.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0A0F1C"/><stop offset="1" stop-color="#121A2E"/></linearGradient>
  <filter id="blur" filterUnits="userSpaceOnUse" x="-400" y="-400" width="2000" height="1550"><feGaussianBlur stdDeviation="90"/></filter>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="18"/></filter>
  <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
  <linearGradient id="pane" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0.14"/><stop offset="1" stop-color="#fff" stop-opacity="0.02"/></linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFD58A" stop-opacity=".9"/><stop offset=".35" stop-color="#FFD58A" stop-opacity="0"/></linearGradient>
  <linearGradient id="archfill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F59E0B" stop-opacity=".55"/><stop offset="1" stop-color="#F59E0B" stop-opacity="0"/></linearGradient>
  <radialGradient id="orbfill" cx="35%" cy="30%" r="80%"><stop offset="0" stop-color="#FFE7B0"/><stop offset=".55" stop-color="#D98A0B"/><stop offset="1" stop-color="#2A1A06"/></radialGradient>
  <radialGradient id="sun" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#F59E0B" stop-opacity=".95"/><stop offset=".7" stop-color="#F59E0B" stop-opacity=".35"/><stop offset="1" stop-color="#F59E0B" stop-opacity="0"/></radialGradient>
  <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#121A2E" stop-opacity=".9"/><stop offset="1" stop-color="#121A2E"/></linearGradient>
  <linearGradient id="fadeTop" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0A0F1C"/><stop offset=".85" stop-color="#0A0F1C" stop-opacity=".0"/></linearGradient>
  <radialGradient id="vig" cx="55%" cy="45%" r="80%"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.45"/></radialGradient>
</defs>
<rect width="1200" height="750" fill="url(#bg)"/>
<g filter="url(#blur)"><ellipse cx="780" cy="380" rx="380" ry="300" fill="#8A5A08" opacity="0.5"/><ellipse cx="1080" cy="110" rx="220" ry="180" fill="#F59E0B" opacity="0.22"/></g>

    <ellipse cx="780" cy="630" rx="230" ry="26" fill="#000" opacity="0.35" filter="url(#soft)"/>
    <circle cx="780" cy="380" r="200" fill="url(#orbfill)"/>
    <circle cx="780" cy="380" r="200" fill="none" stroke="#FFD58A" stroke-opacity=".3" stroke-width="1.2"/>
    <ellipse cx="710" cy="290" rx="70" ry="44" fill="#fff" opacity=".22" filter="url(#soft)"/>
<rect width="1200" height="750" fill="url(#vig)"/>
<rect width="1200" height="750" filter="url(#grain)" opacity="0.075" style="mix-blend-mode:overlay"/>
</svg>