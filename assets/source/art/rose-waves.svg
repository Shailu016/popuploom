<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-label="Rose waves">
<title>Rose waves</title>
<desc>Original PopupLoom abstract artwork authored for this project on 2026-11-18. Layered rose ribbons on soft blush.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFF6F6"/><stop offset="1" stop-color="#F8DCE0"/></linearGradient>
