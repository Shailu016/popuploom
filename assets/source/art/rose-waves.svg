  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#B33A55" stop-opacity=".9"/><stop offset=".35" stop-color="#B33A55" stop-opacity="0"/></linearGradient>
  <linearGradient id="archfill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E58AA0" stop-opacity=".55"/><stop offset="1" stop-color="#E58AA0" stop-opacity="0"/></linearGradient>
  <radialGradient id="orbfill" cx="35%" cy="30%" r="80%"><stop offset="0" stop-color="#E58AA0"/><stop offset=".55" stop-color="#E58AA0"/><stop offset="1" stop-color="#F8DCE0"/></radialGradient>
  <radialGradient id="sun" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#E58AA0" stop-opacity=".95"/><stop offset=".7" stop-color="#E58AA0" stop-opacity=".35"/><stop offset="1" stop-color="#E58AA0" stop-opacity="0"/></radialGradient>
  <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F8DCE0" stop-opacity=".9"/><stop offset="1" stop-color="#F8DCE0"/></linearGradient>
  <linearGradient id="fadeTop" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF6F6"/><stop offset=".85" stop-color="#FFF6F6" stop-opacity=".0"/></linearGradient>
  <radialGradient id="vig" cx="55%" cy="45%" r="80%"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.12"/></radialGradient>
