<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000" viewBox="0 0 1200 1000" role="img" aria-label="Warm amber bokeh on a dark backdrop">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F1115"/>
      <stop offset=".55" stop-color="#191B21"/>
      <stop offset="1" stop-color="#241F16"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#E3A008" stop-opacity=".52"/>
      <stop offset=".55" stop-color="#E3A008" stop-opacity=".15"/>
      <stop offset="1" stop-color="#E3A008" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bokeh" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#FFD489" stop-opacity=".55"/>
      <stop offset=".72" stop-color="#FFB43A" stop-opacity=".12"/>
      <stop offset="1" stop-color="#FFB43A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx=".5" cy=".42" r=".78">
      <stop offset=".55" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity=".5"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="48"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 .05"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="1200" height="1000" fill="url(#base)"/>
  <ellipse cx="640" cy="720" rx="540" ry="400" fill="url(#glow)" filter="url(#soft)"/>
  <g filter="url(#soft)">
    <circle cx="312" cy="322" r="126" fill="url(#bokeh)" opacity=".8"/>
    <circle cx="986" cy="238" r="88" fill="url(#bokeh)" opacity=".55"/>
    <circle cx="872" cy="626" r="158" fill="url(#bokeh)" opacity=".3"/>
    <circle cx="408" cy="846" r="104" fill="url(#bokeh)" opacity=".42"/>
    <circle cx="1062" cy="826" r="62" fill="url(#bokeh)" opacity=".5"/>
  </g>
  <rect width="1200" height="1000" fill="url(#vignette)"/>
  <rect width="1200" height="1000" filter="url(#grain)" opacity=".85"/>
</svg>
