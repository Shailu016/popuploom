<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Lead inbox | PopupLoom</title><link rel="stylesheet" href="/ui.css"><style>main{max-width:1100px;margin:auto;padding:28px 20px}header,.actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:24px}.table-wrap{overflow:auto;max-width:100%}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:12px;border-bottom:1px solid #444;vertical-align:top;max-width:350px;overflow-wrap:anywhere;white-space:pre-wrap}button:disabled{opacity:.5}#status{margin:20px 0}</style></head><body><main><header><a href="/#dash">← My popups</a><h1>Lead inbox</h1></header><h2 id="widgetName"></h2><p>Captured responses, newest first. CSV export includes all saved responses, not just the visible page.</p><div class="actions"><button class="btn" id="refresh">Refresh</button><button class="btn primary" id="export" disabled>Export all leads as CSV</button><button class="btn" id="cancel" hidden>Cancel export</button></div><p id="status" role="status" aria-live="polite"></p><p id="signin" hidden><a href="/">Sign in on the homepage</a>, then return to this inbox.</p><div class="table-wrap"><table id="leadsTable" hidden><thead></thead><tbody></tbody></table></div><button class="btn" id="more" hidden>Load more</button><p><a href="/privacy.html">Privacy and data handling</a></p></main><script src="/app.js"></script><script src="/leads.js"></script></body></html>
